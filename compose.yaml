services:
  blynx-clips:
    build: .
    init: true
    restart: unless-stopped
    stop_grace_period: 45s
    network_mode: host
    environment:
      BLYNX_PUBLIC_ORIGIN: "${BLYNX_PUBLIC_ORIGIN:-}"
      BLYNX_FOLLOW_URL: "${BLYNX_FOLLOW_URL:-}"
      BLYNX_SERVER_PRUNE: "${BLYNX_SERVER_PRUNE:-0}"
    volumes:
      - blynx-data:/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "from urllib.request import urlopen; urlopen('http://127.0.0.1:17866/api/health', timeout=3).close()"
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

volumes:
  blynx-data:
